version: '3.8'

services:
  # ClickHouse для аналитики
  clickhouse:
    image: yandex/clickhouse-server:22.3
    container_name: bionicpro_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=bionicpro_analytics
      - CLICKHOUSE_USER=report_user
      - CLICKHOUSE_PASSWORD=report_bionicpro_2024
    volumes:
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API для отчетов
  reports-api:
    build: .
    container_name: bionicpro_reports_api
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - DEBUG=True
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=report_user
      - CLICKHOUSE_PASSWORD=report_bionicpro_2024
      - CLICKHOUSE_DATABASE=bionicpro_analytics
      - REPORTS_DIR=/app/reports
    volumes:
      - ./reports:/app/reports
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./database:/app/database
      - ./models:/app/models
      - ./services:/app/services
      - ./api:/app/api
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  clickhouse_data: